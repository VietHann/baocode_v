name: VietCode Windows x64 (direct account integrations)

on:
  push:
    branches:
      - feature/multi-provider-connect
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run provider tests
        run: dart test test/models/openrouter_oauth_test.dart test/models/qoder_direct_oauth_test.dart && flutter test test/kernel/account_cli_protocol_test.dart
      - name: Analyze modified Dart files
        run: dart analyze lib/models/oauth_pkce.dart lib/models/openrouter_oauth.dart lib/models/qoder_direct_oauth.dart lib/kernel/account_cli/account_cli_protocol.dart lib/kernel/account_cli/account_cli_kernel.dart lib/kernel/account_cli/account_cli_login_io.dart lib/kernel/kernel_registry.dart lib/settings/pages/models_page.dart test/models/openrouter_oauth_test.dart test/models/qoder_direct_oauth_test.dart test/kernel/account_cli_protocol_test.dart
      - name: Generate VietCode application icons
        shell: pwsh
        run: |
          python -m pip install Pillow
          python tool/vietcode_brand.py
      - name: Build Windows x64
        run: flutter build windows --release
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer EXE
        shell: pwsh
        run: |
          # Reuse the already-built Flutter release and package it with
          # the repository's official installer builder. Stock engine avoids
          # requiring BaoCode upstream's privately patched engine binary.
          dart run tool/build_windows.dart --skip-build --stock-engine --remote-release latest
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed"
          }
          $installer = Get-ChildItem "build/installers" -Filter "VietCode-*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Missing VietCode-<version>-setup.exe"
          }
          Write-Host "Installer: $($installer.FullName), $($installer.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: VietCode-Direct-OAuth-Windows-Setup
          path: build/installers/VietCode-*-setup.exe
          if-no-files-found: error
          retention-days: 30
