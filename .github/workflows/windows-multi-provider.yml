name: VietCode Windows x64 (direct account integrations)

on:
  push:
    branches:
      - feature/multi-provider-connect
  workflow_dispatch:

permissions:
  contents: read

# Repeated OAuth/UI fixes should not waste Windows runners building
# installers for superseded commits. Only the latest branch head matters.
concurrency:
  group: vietcode-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run provider tests
        run: dart test test/models/openrouter_oauth_test.dart test/models/qoder_direct_oauth_test.dart test/models/qoder_direct_inference_test.dart test/models/copilot_direct_test.dart test/models/qoder_direct_inference_test.dart && flutter test test/kernel/account_cli_protocol_test.dart test/kernel/copilot_direct_kernel_test.dart test/models/native_account_upstreams_test.dart test/models/copilot_upstream_proxy_test.dart test/models/qoder_upstream_proxy_test.dart
      - name: Analyze modified Dart files
        run: dart analyze lib/models/oauth_pkce.dart lib/models/openrouter_oauth.dart lib/models/qoder_direct_oauth.dart lib/models/qoder_cosy.dart lib/models/qoder_direct.dart lib/models/copilot_direct.dart lib/models/native_account_upstreams.dart lib/models/model_runtime_io.dart lib/models/proxy/model_proxy.dart lib/kernel/copilot/copilot_direct_kernel.dart lib/kernel/account_cli/account_cli_protocol.dart lib/kernel/account_cli/account_cli_kernel.dart lib/kernel/account_cli/account_cli_login_io.dart lib/kernel/kernel_registry.dart lib/settings/pages/models_page.dart lib/settings/pages/about_page.dart lib/workspace/window_header/about_dialog.dart lib/icons/brand_logos.dart lib/tips/star_prompt.dart test/models/openrouter_oauth_test.dart test/models/qoder_direct_oauth_test.dart test/models/copilot_direct_test.dart test/models/native_account_upstreams_test.dart test/models/copilot_upstream_proxy_test.dart test/models/qoder_upstream_proxy_test.dart test/kernel/account_cli_protocol_test.dart test/kernel/copilot_direct_kernel_test.dart
      - name: Generate VietCode application icons
        shell: pwsh
        run: |
          python -m pip install Pillow
          python tool/vietcode_brand.py
      - name: Verify branding assets and direct integration requirements
        shell: pwsh
        run: |
          if (Test-Path "lib/models/nine_router_bridge.dart") {
            throw "A 9Router gateway adapter must not be shipped"
          }
          python -c "from PIL import Image; im=Image.open('windows/runner/resources/app_icon.ico'); im.verify(); print('VietCode app icon OK')"
          if (-not (Test-Path "assets/branding/app_icon.png")) {
            throw "Missing user portrait inside Flutter assets"
          }
      - name: Build Windows x64
        run: flutter build windows --release
      - name: Verify Windows executable branding
        shell: pwsh
        run: |
          if (-not (Test-Path "build/windows/x64/runner/Release/baocode.exe")) {
            throw "Missing stock Flutter runtime for VietCode"
          }
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer EXE
        shell: pwsh
        run: |
          # Reuse the already-built Flutter release and package it with
          # the repository's official installer builder. Stock engine avoids
          # requiring BaoCode upstream's privately patched engine binary.
          dart run tool/build_windows.dart --skip-build --stock-engine --remote-release latest
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed"
          }
          $installer = Get-ChildItem "build/installers" -Filter "VietCode-*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Missing VietCode-<version>-setup.exe"
          }
          Write-Host "Installer: $($installer.FullName), $($installer.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: VietCode-Direct-OAuth-Windows-Setup
          path: build/installers/VietCode-*-setup.exe
          if-no-files-found: error
          retention-days: 30
