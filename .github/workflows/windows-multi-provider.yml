name: Windows x64 (account OAuth fork)

on:
  push:
    branches:
      - feature/multi-provider-connect
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run provider tests
        run: flutter test test/models/openrouter_oauth_test.dart
      - name: Analyze modified Dart files
        run: dart analyze lib/models/openrouter_oauth.dart lib/settings/pages/models_page.dart test/models/openrouter_oauth_test.dart
      - name: Build Windows x64
        run: flutter build windows --release
      - name: Package executable and required runtime
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/baocode.exe")) {
            throw "Windows build did not produce baocode.exe"
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath "BaoCode-oauth-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BaoCode-oauth-windows-x64
          path: BaoCode-oauth-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
